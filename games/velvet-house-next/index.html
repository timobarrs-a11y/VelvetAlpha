<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Velvet House (Next)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a22; }
    #app { width: 100vw; height: 100dvh; font-family: Inter, system-ui, sans-serif; }
    .vh-stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 90% at 50% 40%, #2a2633 0%, #17151d 70%); }
    .vh-canvas { display: block; width: min(100vw, calc(100dvh * 640 / 440)); aspect-ratio: 640 / 440; height: auto; max-height: 100dvh; }
    .vh-hud { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; pointer-events: none; }
    .vh-chip { display: flex; align-items: baseline; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,253,248,.94); color: #241B25; font-size: 13px; line-height: 1.2; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
    .vh-chip strong { font-weight: 700; font-variant-numeric: tabular-nums; }
    .vh-season { color: #3D6B73; font-weight: 600; }
    .vh-money { color: #4A8C5A; font-weight: 700; }
    .vh-fridge { color: #8A6B4A; font-weight: 600; }
    .vh-controls { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: calc(100% - 32px); }
    .vh-floors, .vh-tools { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(23,21,29,.82); backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    .vh-controls button { appearance: none; border: 0; border-radius: 10px; padding: 8px 12px; min-height: 36px; font: 600 13px/1.2 Inter, system-ui, sans-serif; color: #E9E4EC; background: transparent; cursor: pointer; transition: background .18s ease, color .18s ease, transform .12s ease; }
    .vh-controls button:hover { background: rgba(255,255,255,.1); }
    .vh-controls button:active { transform: scale(.96); }
    .vh-controls button:focus-visible { outline: 2px solid #E0A43A; outline-offset: 1px; }
    .vh-controls button[aria-selected="true"], .vh-controls button[aria-pressed="true"] { background: #F2EEE8; color: #241B25; }
    @media (max-width: 560px) { .vh-controls button { padding: 8px 9px; font-size: 12px; } .vh-hud { top: 8px; left: 8px; } }
    .vh-people { position: absolute; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; width: 216px; }
    .vh-person { appearance: none; border: 1px solid rgba(255,255,255,.06); text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: rgba(23,21,29,.84); backdrop-filter: blur(8px); color: #E9E4EC; font: 400 12px/1.5 Inter, system-ui, sans-serif; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.3); transition: border-color .18s ease, transform .18s ease, background .18s ease; }
    .vh-person:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    .vh-person:focus-visible { outline: 2px solid #E0A43A; outline-offset: 2px; }
    .vh-person[aria-pressed="true"] { border-color: #E0A43A; background: rgba(38,32,30,.9); }
    .vh-person-head { display: flex; align-items: center; gap: 8px; }
    .vh-person-head strong { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .vh-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
    .vh-where { margin-left: auto; font-size: 11px; color: #A9A1AE; }
    .vh-status { color: #F2EEE8; min-height: 18px; }
    .vh-needs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    .vh-need { display: flex; flex-direction: column; gap: 2px; }
    .vh-need-label { font-size: 10px; color: #A9A1AE; letter-spacing: .02em; }
    .vh-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
    .vh-bar i { display: block; height: 100%; border-radius: 2px; background: #5BAE7C; transition: width .4s ease, background-color .4s ease; }
    .vh-bar i[data-tone="mid"] { background: #E0A43A; }
    .vh-bar i[data-tone="low"] { background: #D0544A; }
    .vh-log { position: absolute; bottom: 16px; left: 16px; list-style: none; margin: 0; padding: 0; max-width: 280px; pointer-events: none; }
    .vh-log li { padding: 6px 12px; border-radius: 8px; background: rgba(23,21,29,.72); backdrop-filter: blur(6px); color: #E9E4EC; font-size: 12px; line-height: 1.4; margin-bottom: 4px; opacity: 0; animation: vhFadeIn .4s ease forwards; }
    @keyframes vhFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (max-width: 760px) { .vh-log { display: none; } }
  </style>
  <link rel="stylesheet" href="/games/velvet-house-next/game-ui.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/games/velvet-house/main.ts"></script>
</body>
</html>
