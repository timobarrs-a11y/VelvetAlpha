name: Checks

# Typecheck, unit tests and the short live tests of the game, on every pull request and on main. The story tests
# play the opening in a real Chromium, so a green run means the scene rules held, not only that the code compiled.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  live-game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boot, story, menu and companions (desktop)
        run: npx playwright test --config playwright.live.config.ts e2e/velvet-sims/boot.spec.ts e2e/velvet-sims/story.spec.ts e2e/velvet-sims/menu.spec.ts e2e/velvet-sims/companions.spec.ts --project=desktop
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
