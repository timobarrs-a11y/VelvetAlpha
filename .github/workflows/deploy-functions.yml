name: Deploy edge functions

# Deploys the Supabase edge functions that changed whenever they are merged to main, so nobody has
# to do it from a laptop. You can also run it by hand: Actions > Deploy edge functions > Run
# workflow, and give a function name. One-time setup: add a repository secret named
# SUPABASE_ACCESS_TOKEN (Supabase dashboard > Account > Access Tokens > Generate new token).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy, e.g. atlas-onboarding'
        required: true
        default: atlas-onboarding

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FUNCTION_INPUT: ${{ github.event.inputs.function }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'lcygiskxwxomytglkwnt' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so nothing was deployed. See the note at the top of this workflow."
            exit 0
          fi
          # shellcheck disable=SC2086
          scripts/deploy-functions.sh "$PROJECT_REF" $FUNCTION_INPUT
