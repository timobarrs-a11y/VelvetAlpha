<title>Maple Street Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=Yellowtail&display=swap">
<style>
  /* Layout: the street fills the screen; controls float on frosted night-glass panels at the edges. */
  :root {
    --ink: #F4EFF7;
    --ink-2: #C9C0D3;
    --ink-3: #958AA3;
    --glass: rgba(24, 19, 34, 0.78);
    --glass-2: rgba(40, 32, 54, 0.92);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #F06A9B;
    --accent-ink: #2A0F1C;
    --gold: #F5B82E;
    --ok: #59C98A;
    --ground: #9FB09A;
    --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --font-ui: "Instrument Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  #stage.dragging { cursor: grabbing; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(10, 6, 20, 0.35); }

  .top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; z-index: 5; }
  .top > * { pointer-events: auto; }
  .brand { padding: 10px 14px; display: grid; gap: 2px; }
  .brand b { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .brand span { font-size: 12px; color: var(--ink-2); }
  .brand em { font-style: normal; color: var(--ink-3); }
  .controls { margin-left: auto; padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
  .seg { display: inline-flex; background: rgba(255, 255, 255, 0.06); border-radius: 11px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #1E1828; }
  .time { display: flex; align-items: center; gap: 8px; padding: 2px 6px 2px 2px; }
  .time button { width: 32px; height: 32px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, 0.08); display: grid; place-items: center; }
  .time output { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; min-width: 64px; }
  .time input[type="range"] { width: 150px; accent-color: var(--accent); }
  .ghost { border: 1px solid var(--line); background: transparent; padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }

  .hint { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding: 8px 12px; font-size: 12.5px; color: var(--ink-2); z-index: 4; max-width: calc(100% - 32px); }
  .hint b { color: var(--ink); font-weight: 600; }
  .stats { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding: 8px 12px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; z-index: 4; }

  .panel { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 84px); right: max(16px, env(safe-area-inset-right, 0px)); width: 360px; max-height: calc(100% - 170px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto; padding: 0; }
  .panel[hidden] { display: none; }
  .card { padding: 18px 18px 14px; display: grid; gap: 12px; }
  .card-head { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff; flex: none; }
  .who { min-width: 0; display: grid; gap: 2px; }
  .who h2 { margin: 0; font-family: var(--font-display); font-size: 21px; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; }
  .who p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
  .close { margin-left: auto; align-self: flex-start; width: 30px; height: 30px; border-radius: 9px; border: 0; background: rgba(255, 255, 255, 0.08); font-size: 18px; line-height: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: var(--ink-2); letter-spacing: 0.02em; }
  .chip.member { background: rgba(245, 184, 46, 0.16); color: var(--gold); }
  .chip.new { background: rgba(89, 201, 138, 0.16); color: var(--ok); }
  .headline { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ink); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700; }
  .goal { display: grid; gap: 6px; }
  .goal-row { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; }
  .bar { height: 7px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #F5A3C1); }
  .medals { display: grid; gap: 6px; }
  .medal { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .medal canvas { width: 24px; height: 24px; flex: none; }
  .medal small { color: var(--ink-3); text-transform: capitalize; }
  .add { border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
  .add[disabled] { background: rgba(255, 255, 255, 0.1); color: var(--ink-2); cursor: default; }
  .fine { margin: -4px 0 0; font-size: 12px; color: var(--ink-3); }

  details.kit { border-top: 1px solid var(--line); }
  details.kit > summary { list-style: none; padding: 14px 18px; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  details.kit > summary::-webkit-details-marker { display: none; }
  details.kit > summary::after { content: "+"; color: var(--ink-3); font-size: 18px; }
  details.kit[open] > summary::after { content: "–"; }
  .kit-body { padding: 0 18px 18px; display: grid; gap: 14px; }
  .lockbox { display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: rgba(245, 184, 46, 0.08); border: 1px solid rgba(245, 184, 46, 0.25); font-size: 13px; color: var(--ink-2); }
  .toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
  .opt { display: grid; gap: 7px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); padding: 6px 9px; border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .opts button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: rgba(255, 255, 255, 0.12); }
  .opts button:disabled { opacity: 0.4; cursor: not-allowed; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatches button { width: 24px; height: 24px; border-radius: 8px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }
  .swatches button:disabled { opacity: 0.35; cursor: not-allowed; }

  .pop { position: fixed; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 84px); right: max(16px, env(safe-area-inset-right, 0px)); width: 280px; padding: 14px; display: grid; gap: 10px; }
  .pop[hidden] { display: none; }
  .pop h3 { margin: 0; font-family: var(--font-display); font-size: 16px; }
  .friend { display: flex; align-items: center; gap: 10px; }
  .friend .dot { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; flex: none; }
  .friend span { min-width: 0; flex: 1; font-size: 13.5px; font-weight: 600; }
  .friend small { display: block; color: var(--ink-3); font-weight: 500; font-size: 12px; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost.strong { color: var(--ink); border-color: rgba(255, 255, 255, 0.3); }
  .day { font-size: 12px; color: var(--ink-3); padding: 0 4px; white-space: nowrap; }
  @media (max-width: 760px) {
    .controls { margin-left: 0; width: 100%; justify-content: flex-start; }
    .time input[type="range"] { width: 110px; }
    .panel { top: auto; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-height: 58%; }
    .hint { display: none; }
    .brand b { font-size: 16px; }
    .brand { padding: 8px 12px; }
    .controls { padding: 6px; gap: 6px; }
    .seg button, .ghost { padding: 5px 8px; font-size: 12px; }
    .time output { min-width: 56px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<canvas id="stage" aria-label="Velvet World: a street of resident houses and billboards. Drag to look around, tap a billboard to see who lives there."></canvas>

<header class="top">
  <div class="brand glass"><b id="title">Your block today</b><span>Velvet World <em>(working name)</em> · art test</span></div>
  <div class="controls glass" role="toolbar" aria-label="Scene controls">
    <div class="seg" id="view" role="group" aria-label="View">
      <button type="button" data-v="street" aria-pressed="true">My block</button><button type="button" data-v="town">Whole town</button>
    </div>
    <button class="ghost strong" id="tomorrow" type="button">Tomorrow →</button>
    <span class="day" id="day">Day 1</span>
    <button class="ghost" id="friends" type="button">Friends</button>
    <div class="time">
      <button id="play" type="button" aria-label="Play the day">▶</button>
      <input id="hour" type="range" min="0" max="24" step="0.05" value="17.6" aria-label="Time of day">
      <output id="clock" for="hour">5:36 PM</output>
    </div>
    <div class="seg" id="season" role="group" aria-label="Season">
      <button type="button" data-v="spring">Spring</button><button type="button" data-v="summer" aria-pressed="true">Summer</button><button type="button" data-v="fall">Fall</button><button type="button" data-v="winter">Winter</button>
    </div>
    <div class="seg" id="mode" role="group" aria-label="Show plots as">
      <button type="button" data-v="mixed" aria-pressed="true">Mixed</button><button type="button" data-v="free">All free</button><button type="button" data-v="member">All members</button>
    </div>
    <button class="ghost" id="tower" type="button">Clock tower</button>
  </div>
</header>

<aside class="panel glass" id="panel" hidden aria-live="polite"></aside>
<aside class="pop glass" id="friend-pop" hidden></aside>
<p class="hint glass" id="hint"><b>Drag</b> to walk the block · <b>scroll or pinch</b> to zoom · <b>tap a billboard</b> to meet the neighbor</p>
<p class="stats glass" id="stats">Loading the town…</p>

<script type="module">
/*__STREET_ART__*/

// ---------------------------------------------------------------------------------------------
// A sample town of 2,000 made-up residents
// ---------------------------------------------------------------------------------------------
const TOWN_SIZE = 2000;
const layout = townLayout(TOWN_SIZE);
const rnd = (k) => { const s = Math.sin(k * 91.7 + 13.1) * 43758.5453; return s - Math.floor(s); };
const choose = (a, k) => a[Math.floor(rnd(k) * a.length) % a.length];
const FIRST = ['Ava', 'Jordan', 'Mia', 'Noah', 'Zoe', 'Eli', 'Nia', 'Leo', 'Ivy', 'Kai', 'Rosa', 'Omar', 'June', 'Ezra', 'Maya', 'Cole', 'Ana', 'Kofi', 'Dee', 'Theo', 'Jon', 'Sam', 'Lena', 'Priya', 'Marcus', 'Tess', 'Ravi', 'Bea', 'Luis', 'Hana', 'Owen', 'Sade', 'Ines', 'Malik', 'Grace', 'Felix'];
const GOALS = [['Training for my first 10K', '10K run'], ['Learning Spanish', 'Spanish lessons'], ['Paying off my card', 'Debt free'], ['Meditating every morning', 'Morning sits'], ['Writing my novel', 'Chapters'], ['Getting stronger', 'Gym days'], ['Reading 24 books this year', '24 books'], ['Learning guitar, one song a week', '12 songs'], ['Cooking one new recipe a week', 'New recipes'], ['Saving for a house', 'Down payment'], ['Walking 10,000 steps a day', 'Step streak'], ['Building my design studio', 'Launch the site']];
const SPACES = ['Fitness & Motivation', 'Books & Writing', 'Gaming Lounge', 'Cooking & Recipes', 'Career & Money', 'Travel & Adventure', 'Movies, Music & Pop Culture', 'Creative Corner'];
const STARTERS = HOUSE_STYLES.filter((h) => h.tier === 'starter').map((h) => h.id), MEMBERS = HOUSE_STYLES.filter((h) => h.tier === 'member').map((h) => h.id);
const MEDAL_IDS = Object.keys(MEDALS);
function makeResident(k) {
  const slot = layout.slots[k], member = rnd(k * 7 + 2) < 0.38, g = choose(GOALS, k * 3 + 1);
  const earned = MEDAL_IDS.filter((m, j) => rnd(k * 13 + j * 7) < (m === 'iron-will' ? 0.07 : m === 'the-closer' ? 0.05 : m === 'hat-trick' ? 0.12 : m === 'day-one' ? 0.02 : 0.25));
  const earnedHouses = HOUSE_STYLES.filter((h) => h.tier === 'earned' && earned.includes(h.medal)).map((h) => h.id);
  let style = member ? (rnd(k * 17) < 0.8 ? choose(MEMBERS, k * 19) : choose(STARTERS, k * 23)) : choose(STARTERS, k * 29);
  if (earnedHouses.length && rnd(k * 31) < 0.55) style = choose(earnedHouses, k * 37);
  const colored = member || rnd(k * 41) < 0.7;
  return {
    id: `r${k}`, number: (slot.col + 1) * 2, member, origin: slot,
    profile: { name: `${choose(FIRST, k * 5)} ${String.fromCharCode(65 + Math.floor(rnd(k * 11) * 26))}.`, headline: g[0], goal: { label: g[1], pct: Math.round(8 + rnd(k * 43) * 88) }, medals: earned.slice(0, 3).length ? earned.slice(-3) : ['first-step'], earned, medalCount: earned.length, spaces: [choose(SPACES, k * 47)], newNeighbor: rnd(k * 53) < 0.04, address: slot.address },
    config: {
      house: colored ? { style, body: choose(COLORS.body, k * 59), roof: choose(COLORS.roof, k * 61), door: choose(COLORS.door, k * 67), windows: choose(['classic', 'shutters', 'arched', 'classic'], k * 71) } : { style },
      sign: { style: choose(['classic', 'marquee', 'round', 'hanging', 'neon'], k * 73), color: choose(COLORS.sign, k * 79) },
      car: rnd(k * 83) < 0.6 ? { type: choose(['hatch', 'suv', 'pickup', 'vintage'], k * 89), color: choose(COLORS.car, k * 97) } : { type: 'none' },
      pet: rnd(k * 101) < 0.5 ? { kind: choose(['dog', 'cat'], k * 103), coat: undefined } : { kind: 'none' },
      lawn: choose(['plain', 'striped', 'garden', 'meadow', 'zen'], k * 107), tree: choose(['none', 'oak', 'cherry', 'pine'], k * 109),
      extras: { fountain: rnd(k * 113) < 0.18, flag: rnd(k * 127) < 0.3, lights: rnd(k * 131) < 0.4, lanterns: rnd(k * 137) < 0.3 },
    },
  };
}
const residents = Array.from({ length: TOWN_SIZE }, (_, k) => makeResident(k));
residents.forEach((r) => { if (r.config.pet.kind !== 'none') r.config.pet.coat = choose(COLORS.coat[r.config.pet.kind], r.number * 3); });
// You: a free resident in the middle of town who has earned Hat Trick (so the treehouse is open to you)
const YOU = Math.floor(TOWN_SIZE / 2) + 7;
Object.assign(residents[YOU], { member: false });
Object.assign(residents[YOU].profile, { name: 'You', headline: 'Your goal shows up here', goal: { label: 'Your goal', pct: 35 }, medals: ['hat-trick', 'showed-up', 'first-step'], earned: ['hat-trick', 'showed-up', 'first-step'], medalCount: 3, spaces: ['Books & Writing'], newNeighbor: false });
residents[YOU].config.house = { style: 'cottage', body: '#EFE7D8', roof: '#5F6E52', door: '#C2413A' };
// Three friends with standout houses, spread around town
const FRIENDS = [
  [137, 'Marcus J.', true, { style: 'victorian' }, ['iron-will', 'a-friend-in-need', 'day-one']],
  [1544, 'Lena R.', false, { style: 'lighthouse', roof: '#C2413A' }, ['iron-will', 'coachable', 'halfway-there']],
  [762, 'Priya S.', true, { style: 'observatory' }, ['the-closer', 'halfway-there', 'life-of-the-party']],
];
FRIENDS.forEach(([k, name, member, house, medals]) => { const r = residents[k]; r.member = member; r.profile.name = name; r.profile.medals = medals; r.profile.earned = [...new Set([...medals, ...r.profile.earned])]; r.profile.medalCount = r.profile.earned.length; r.config.house = house; });
const savedMember = new Map(residents.map((r) => [r.id, r.member]));

// ---------------------------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------------------------
const canvas = document.getElementById('stage'), ctx = canvas.getContext('2d');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const state = { view: 'street', hour: 17.6, season: 'summer', mode: 'mixed', playing: false, selected: null, preview: new Set(), sent: new Set(), friends: new Set(FRIENDS.map(([k]) => `r${k}`)), day: 1, seen: new Set(), kitOpen: false };
const cam = { x: 0, y: 0, zoom: 1.2 };
let W = 0, H = 0, dpr = 1, flight = null, zoomSettled = 0, street = [];
const streetCache = new Map(), townCache = new Map();
let townImage = null;

function effective(p) {
  const member = state.mode === 'member' ? true : state.mode === 'free' ? false : (p.member || state.preview.has(p.id));
  return member === p.member ? p : { ...p, member, _resolved: null };
}
const cacheKey = (p) => JSON.stringify([p.member, p.config, p.profile.name, p.profile.medals, state.season]);

// ---------------------------------------------------------------------------------------------
// Today's block: everyone rotates daily, nobody repeats until we run out, no matching neighbors
// ---------------------------------------------------------------------------------------------
function buildStreet(day) {
  const you = residents[YOU], mySpace = you.profile.spaces[0];
  const order = residents.map((_, k) => k).filter((k) => k !== YOU).sort((a, b) => rnd(a * 3.1 + day * 17.7) - rnd(b * 3.1 + day * 17.7));
  let pool = order.filter((k) => !state.seen.has(k));
  if (pool.length < 8) { state.seen.clear(); pool = order; }
  // a few neighbors who share your interests, the rest from anywhere in town
  const shared = pool.filter((k) => residents[k].profile.spaces.includes(mySpace)).slice(0, 3);
  const rest = pool.filter((k) => !shared.includes(k));
  const queue = [shared[0], rest[0], shared[1], rest[1], rest[2], shared[2], rest[3], rest[4], ...rest.slice(5, 40)].filter((k) => k !== undefined);
  const looks = (k) => { const r = resolvePlot(effective(residents[k])); return `${r.house.style}|${r.house.body}`; };
  const slots = [], used = new Set();
  for (let pos = 0; pos < 9; pos++) {
    if (pos === 4) { slots.push(YOU); continue; }
    const left = slots[pos - 1];
    const k = queue.find((c) => !used.has(c) && (left === undefined || looks(c) !== looks(left)));
    used.add(k); slots.push(k);
  }
  slots.forEach((k) => { if (k !== YOU) state.seen.add(k); });
  street = slots.map((k) => residents[k]);
  streetCache.clear(); state.selected = null; renderPanel();
  document.getElementById('day').textContent = `Day ${day}`;
}

// ---------------------------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------------------------
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2.5); W = window.innerWidth; H = window.innerHeight; canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
function flyTo(x, y, zoom, ms = 900) { flight = { from: { ...cam }, to: { x, y, zoom }, t0: performance.now(), ms }; }
const narrow = () => W < 760;
function frameStreet() { cam.zoom = narrow() ? Math.max(0.55, W / 640) : Math.min(1.5, W / 1300); const [ax, ay] = iso(narrow() ? 43.5 : 45, 5.2, 1.2); cam.x = ax; cam.y = ay + (narrow() ? -40 : 30); }
function townFit() { const b = townBounds(layout); return { x: b.x + b.w / 2, y: b.y + b.h / 2, zoom: Math.min(W / b.w, (H - 120) / b.h) * 0.95 }; }
function plotCenter(r) { const o = r.origin; return iso(o.x + 4, o.y + 4.5, 1.5); }

// ---------------------------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------------------------
function buildPlotCache(cache, key, p, i, scale) {
  const b = plotBounds(i, p), pxW = Math.ceil(b.w * scale), pxH = Math.ceil(b.h * scale);
  const entry = { key: cacheKey(p), scale, b, e: p, live: pxW * pxH > 7e6 };
  p._resolved = resolvePlot(p);
  if (!entry.live) {
    const mk = () => { const c = document.createElement('canvas'); c.width = pxW; c.height = pxH; const o = c.getContext('2d'); o.setTransform(scale, 0, 0, scale, -b.x * scale, -b.y * scale); return [c, o]; };
    const env = { season: state.season };
    const [cb, ob] = mk(); entry.meta = drawPlot(ob, p, i, 'back', env); entry.back = cb;
    const [cf, of] = mk(); drawPlot(of, p, i, 'front', env); entry.front = cf;
  }
  cache.delete(key); cache.set(key, entry);
  if (cache.size > 140) cache.delete(cache.keys().next().value);
  return entry;
}
function drawDetailed(cache, key, p, i, s, env, t, budget) {
  const e = effective(p), c = cache.get(key);
  const fresh = c && c.key === cacheKey(e) && (Math.abs(c.scale - s) / s < 0.02 || performance.now() < zoomSettled);

  document.getElementById('hint').innerHTML = v === 'street' ? '<b>Drag</b> to walk the block · <b>scroll or pinch</b> to zoom · <b>tap a billboard</b> to meet the neighbor' : '<b>Zoom in</b> to see houses · <b>tap a lot</b> to fly there · pins show you and your friends';
  if (v === 'street') { frameStreet(); flight = null; }
  else if (animate) { const [cx, cy] = plotCenter(residents[YOU]); cam.x = cx; cam.y = cy; cam.zoom = narrow() ? 0.7 : 1.0; const f = townFit(); setTimeout(() => flyTo(f.x, f.y, f.zoom, 1800), 350); }
  state.selected = null; renderPanel();
}
segment('view', null, (v) => setView(v));
document.getElementById('tomorrow').addEventListener('click', () => { state.day++; buildStreet(state.day); frameStreet(); });
document.getElementById('friends').addEventListener('click', () => { renderFriends(); pop.hidden = !pop.hidden; if (!pop.hidden) { panel.hidden = true; state.selected = null; } });
document.getElementById('tower').addEventListener('click', () => {
  if (state.view === 'street') { const lx = Math.min(street.length * LOT_W / 2, 12), [x, y] = iso(lx, -12.6, 4.4); flyTo(x, y + 40, narrow() ? 0.7 : 1.0); }
  else { const q = layout.square, [x, y] = iso(q.cx, q.cy, 4); flyTo(x, y, narrow() ? 0.6 : 0.9, 1200); }
});

window.addEventListener('resize', () => { resize(); streetCache.clear(); townCache.clear(); });
resize(); buildStreet(state.day); frameStreet(); syncClock();
requestAnimationFrame(render);
if (document.fonts && document.fonts.load) Promise.all(['800 12px "Bricolage Grotesque"', '400 12px "Alfa Slab One"', '700 12px "Fraunces"', '400 12px "Yellowtail"', '600 12px "Instrument Sans"'].map((f) => document.fonts.load(f).catch(() => null))).then(() => { streetCache.clear(); townCache.clear(); townImage = null; });
</script>
