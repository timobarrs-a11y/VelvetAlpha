    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=Libre+Bodoni:ital,wght@0,400;0,700;1,400&family=Josefin+Slab:wght@300;400;600&family=Oswald:wght@400;600&family=Barlow:wght@400;600&family=Exo+2:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@400;600&family=Arvo:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&family=Raleway:wght@400;600&family=Quicksand:wght@400;600&family=Mulish:wght@400;600&family=Karla:wght@400;600&family=Outfit:wght@400;600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
    <title>Project Velvet</title>
  </head>
  <body>
    <!-- Theme boot: set data-theme before first paint to avoid a flash. Mirrors
         src/stores/themeStore.ts (dark is the CSS default; only light is stamped). -->
    <script>
    (function() {
      try {
        var pref = localStorage.getItem('va-theme') || 'dark';
        var dark = pref === 'dark'
          || (pref === 'system' && window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (!dark) document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) { /* default dark */ }
    })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Touch devices: disable decorative canvas overlays to keep main thread responsive -->
    <style>
      @media (pointer: coarse) { #stardustCanvas, #parallaxCanvas { display: none !important; } }
    </style>

    <!-- STARDUST MOUSE TRAIL -->
    <style id="stardustStyle"></style>
    <canvas id="stardustCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none;"></canvas>
    <script>
    (function() {
      if (window.matchMedia('(pointer: coarse)').matches) return;
      const gameRoutes = ['/checkers', '/pacman', '/momentum', '/slime-soccer', '/stellar-pursuit', '/stellar-pursuit-preview', '/noir-shooter', '/fox-runner'];
      const c = document.getElementById('stardustCanvas');
      const styleEl = document.getElementById('stardustStyle');
      const ctx = c.getContext('2d');
      let w, h, mx = -100, my = -100, particles = [];
      let isGamePage = false;
      let animationId = null;

      function checkIfGamePage() {
        const path = window.location.pathname;
        return gameRoutes.some(route => path.startsWith(route));
      }

      function updateVisibility() {
        isGamePage = checkIfGamePage();
        if (isGamePage) {
          c.style.display = 'none';
          styleEl.textContent = '';
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
        } else {
          c.style.display = 'block';
          styleEl.textContent = 'body { cursor: none; }';
          if (!animationId) {
            loop();
          }
        }
      }

      function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
      document.addEventListener('mouseleave', () => { mx = -100; my = -100; });

      // Watch for route changes
      let lastPath = window.location.pathname;
      setInterval(() => {
        if (window.location.pathname !== lastPath) {
          lastPath = window.location.pathname;
          updateVisibility();
        }
      }, 100);

      // Draw a 5-pointed star shape
      function drawStar(cx, cy, outerR, innerR, points, rotation, fill, glow, glowSize) {
        ctx.save();
        if (glow) { ctx.shadowBlur = glowSize || 10; ctx.shadowColor = glow; }
        ctx.fillStyle = fill;
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2 + (rotation || 0);
          const sx = cx + Math.cos(a) * r;
          const sy = cy + Math.sin(a) * r;
          i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Draw the star cursor
      function drawCursor() {
        if (mx < 0) return;
        // Outer glow
        drawStar(mx, my, 14, 6, 5, 0,
          'rgba(180, 120, 255, 0.15)', 'rgba(160, 100, 255, 0.4)', 20);
        // Main star
        drawStar(mx, my, 9, 4, 5, 0,
          'rgba(210, 170, 255, 0.9)', 'rgba(160, 100, 255, 0.6)', 12);
        // Bright center
        drawStar(mx, my, 4, 2, 5, 0,
          'rgba(240, 220, 255, 0.95)', null, 0);
      }

      function spawn() {
        if (mx < 0 || isGamePage) return;
        for (let i = 0; i < 4; i++) {
          const a = Math.random() * Math.PI * 2;
          const s = Math.random() * 2 + 0.5;
          particles.push({
            x: mx + (Math.random() - 0.5) * 6,
            y: my + (Math.random() - 0.5) * 6,
            r: Math.random() * 3 + 1,
            life: 1,
            decay: 0.02 + Math.random() * 0.015,
            hue: 250 + Math.random() * 60,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - 0.5,
            tw: Math.random() * Math.PI * 2
          });
        }
      }

      function drawParticle(p) {
        const twinkle = Math.sin(p.tw) * 0.5 + 0.5;
        const alpha = p.life * twinkle;
        drawStar(p.x, p.y, p.r, p.r * 0.3, 4, p.tw,
          `hsla(${p.hue}, 90%, 80%, ${alpha})`,
          `hsla(${p.hue}, 90%, 70%, ${alpha})`, 8);
        p.tw += 0.15;
      }

      function loop() {
        if (isGamePage) return;
        ctx.clearRect(0, 0, w, h);
        spawn();
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;
          drawParticle(p);
        });
        particles = particles.filter(p => p.life > 0);
        drawCursor();
        animationId = requestAnimationFrame(loop);
      }

      updateVisibility();
    })();
    </script>

    <!-- PARALLAX FLOATING BACKGROUND -->
    <canvas id="parallaxCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>
    <script>
    (function() {
      if (window.matchMedia('(pointer: coarse)').matches) return;
      const c = document.getElementById('parallaxCanvas');
      const ctx = c.getContext('2d');
      let w, h;
      let shapes = [];
      let mouseX = 0, mouseY = 0;

      function resize() {
        w = c.width = window.innerWidth;
        h = c.height = window.innerHeight;
        if (shapes.length === 0) initShapes();
      }

      function initShapes() {
        shapes = [];
        const count = Math.floor((w * h) / 40000);
        for (let i = 0; i < count; i++) {
          shapes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 60 + 20,
            speedX: (Math.random() - 0.5) * 0.3,
            speedY: (Math.random() - 0.5) * 0.3,
            hue: 250 + Math.random() * 60,
            opacity: Math.random() * 0.03 + 0.01,
            type: Math.floor(Math.random() * 3),
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - 0.5) * 0.002
          });
        }
      }

      function drawShape(shape) {
        ctx.save();
        ctx.globalAlpha = shape.opacity;
        ctx.translate(shape.x, shape.y);
        ctx.rotate(shape.rotation);

        const color = `hsl(${shape.hue}, 80%, 70%)`;
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        if (shape.type === 0) {
          // Circle
          ctx.beginPath();
          ctx.arc(0, 0, shape.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (shape.type === 1) {
          // Triangle
          ctx.beginPath();
          for (let i = 0; i < 3; i++) {
            const angle = (i / 3) * Math.PI * 2 - Math.PI / 2;
            const x = Math.cos(angle) * shape.size / 2;
            const y = Math.sin(angle) * shape.size / 2;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
        } else {
          // Diamond
          ctx.beginPath();
          ctx.moveTo(0, -shape.size / 2);
          ctx.lineTo(shape.size / 2, 0);
          ctx.lineTo(0, shape.size / 2);
          ctx.lineTo(-shape.size / 2, 0);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);

        shapes.forEach(shape => {
          // Parallax effect based on mouse position
          const parallaxX = (mouseX / w - 0.5) * 30;
          const parallaxY = (mouseY / h - 0.5) * 30;

          shape.x += shape.speedX - parallaxX * 0.01;
          shape.y += shape.speedY - parallaxY * 0.01;
          shape.rotation += shape.rotationSpeed;

          // Wrap around screen edges
          if (shape.x < -shape.size) shape.x = w + shape.size;
          if (shape.x > w + shape.size) shape.x = -shape.size;
          if (shape.y < -shape.size) shape.y = h + shape.size;
          if (shape.y > h + shape.size) shape.y = -shape.size;

          drawShape(shape);
        });

        requestAnimationFrame(animate);
      }

      document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      resize();
      window.addEventListener('resize', resize);
      animate();
    })();
    </script>
  </body>
</html>
