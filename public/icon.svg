<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#be185d"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Subtle inner glow ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- V letterform -->
  <path d="M140 148 L256 364 L372 148" fill="none" stroke="url(#heart)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Small decorative dot at top of V arms -->
  <circle cx="140" cy="148" r="26" fill="white" opacity="0.95"/>
  <circle cx="372" cy="148" r="26" fill="white" opacity="0.95"/>
  <circle cx="256" cy="364" r="26" fill="white" opacity="0.95"/>
</svg>
