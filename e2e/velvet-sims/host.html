<!doctype html>
<!-- A stand-in for the Velvet app page that wraps the game. It answers the game's AI requests with a canned reply
     and records what the game asked for, so the tests need no account or backend. -->
<html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"></head><body style="margin:0">
<iframe id="g" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
<script>
  // ?script plays the story; without it the story is switched off so the other tests start in a furnished house.
  // ?freeze starts the game paused, so a screenshot is the same every time.
  // ?visit opens a friend's house (the test puts it under velvet-sims:visit first), as the app's visit page does.
  document.getElementById('g').src = location.search.includes('visit') ? '/games/velvet-house-next/index.html?visit=1'
    : '/games/velvet-house-next/index.html?companion=e2e' + (location.search.includes('freeze') ? '&freeze=1' : '') + (location.search.includes('menu') ? '' : '&nomenu=1') + (location.search.includes('script') ? '' : '&noscript=1');
</script>
<script>
window.sampleLog = [];
// More than one companion to choose from: set window.companionCount before the game asks, and window.startAnswer to
// 'go' (carry on), 'cancel', or 'other' (move in with a different companion, as the app does).
window.companionCount = 0; window.houseCount = 0; window.startAnswer = 'go'; window.startRequests = 0; window.startModes = [];
addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;
  if ((d.type === 'velvet:ready' || d.type === 'velvet:menuReady') && window.companionCount > 0) e.source.postMessage({ type: 'velvet:companions', count: window.companionCount, houses: window.houseCount }, location.origin);
  if (d.type !== 'velvet:startRequested') return;
  window.startRequests++; window.startModes.push(d.mode);
  if (window.startAnswer === 'go') e.source.postMessage({ type: 'velvet:startGo' }, location.origin);
  else if (window.startAnswer === 'cancel') e.source.postMessage({ type: 'velvet:startCancel' }, location.origin);
  else document.getElementById('g').src = '/games/velvet-house-next/index.html?companion=e2e-b&start=' + (window.startAnswer === 'other-continue' ? 'continue' : 'new') + (location.search.includes('script') ? '' : '&noscript=1');
});
window.reply = 'Hey you. I was just thinking about you.';
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'velvet:sample') return;
  window.sampleLog.push(d.input);
  setTimeout(() => e.source.postMessage({ type: 'velvet:sampleResult', seq: d.seq, text: window.reply }, location.origin), 100);
});

// Friends' houses: tests set window.friendHouses and window.visitsOpen; a visit asked for lands in window.visitTo, and Go
// home from a visit sets window.visitEnded.
window.friendHouses = []; window.visitsOpen = true; window.visitTo = null; window.visitEnded = false; window.housesLog = [];
addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;
  if (d.type === 'velvet:visit') { window.visitTo = d.owner; return; }
  if (d.type === 'velvet:visitEnd') { window.visitEnded = true; return; }
  if (d.type !== 'velvet:houses') return;
  window.housesLog.push(d.op);
  const answer = (body) => setTimeout(() => e.source.postMessage({ type: 'velvet:housesResult', seq: d.seq, ...body }, location.origin), 50);
  if (d.op === 'friends') return answer({ ok: true, data: window.friendHouses });
  if (d.op === 'open') return answer({ ok: true, data: window.visitsOpen });
  if (d.op === 'setOpen') { window.visitsOpen = d.open; return answer({ ok: true, data: d.open }); }
});

// Sharing designs: a small in-memory stand-in for the database. Tests set window.friendDesigns, window.pendingDesigns and
// window.moderator before opening the Community tab.
window.designsLog = [];
window.friendDesigns = [];
window.pendingDesigns = [];
window.moderator = false;
const mine = [];
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'velvet:designs') return;
  window.designsLog.push({ op: d.op, args: d.args });
  const answer = (body) => setTimeout(() => e.source.postMessage({ type: 'velvet:designsResult', seq: d.seq, ...body }, location.origin), 50);
  const a = d.args || {};
  switch (d.op) {
    case 'caps': return answer({ ok: true, data: { moderator: window.moderator } });
    case 'friends': return answer({ ok: true, data: window.friendDesigns });
    case 'gallery': return answer({ ok: true, data: [] });
    case 'mine': return answer({ ok: true, data: mine });
    case 'publish': {
      if (/bad/i.test(a.name)) return answer({ ok: false, error: 'blocked' });
      const row = { id: 'd' + (mine.length + 1), name: a.name, code: a.code, visibility: a.visibility, status: a.visibility === 'public' ? 'pending' : 'approved', report_count: 0 };
      mine.push(row);
      return answer({ ok: true, data: { id: row.id, status: row.status } });
    }
    case 'delete': { const i = mine.findIndex((m) => m.id === a.id); if (i >= 0) mine.splice(i, 1); return answer({ ok: i >= 0, data: i >= 0 }); }
    case 'report': return answer({ ok: true, data: 'approved' });
    case 'pending': return answer({ ok: true, data: window.pendingDesigns });
    case 'review': window.pendingDesigns = window.pendingDesigns.filter((p) => p.id !== a.id); return answer({ ok: true, data: a.approve ? 'approved' : 'rejected' });
    default: return answer({ ok: false, error: 'unavailable' });
  }
});

// Promo codes are the account's: the game reports a code it redeemed (window.promoLog), and when a house opens the
// host sends the codes already on the account. Tests set window.accountPromos before the game says ready.
window.promoLog = [];
window.accountPromos = window.accountPromos || [];
addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;
  // Like the app: a code redeemed anywhere (the start menu included) is now the account's.
  if (d.type === 'velvet:promo') { window.promoLog.push(d.code); if (!window.accountPromos.includes(d.code)) window.accountPromos.push(d.code); }
  if (d.type === 'velvet:ready' && window.accountPromos.length) e.source.postMessage({ type: 'velvet:promos', codes: window.accountPromos }, location.origin);
});
</script>
</body></html>
